name: Apply amount reconciliation SVG

on:
  push:
    branches:
      - feat/amount-reconciliation-svg

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply SVG patch
        run: python scripts/apply_amount_svg_patch.py

      - name: Run tests
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Commit final change
        run: |
          rm scripts/apply_amount_svg_patch.py
          rm .github/workflows/apply-amount-reconciliation-svg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add SVG amount reconciliation chart"
          git push origin HEAD:feat/amount-reconciliation-svg
